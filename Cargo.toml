[workspace]
members = [
    "crates/velin-syntax",
    "crates/velin-parse",
    "crates/velin-eval",
    "crates/velin-compile",
    "crates/velin-vm",
    "crates/velin-check",
    "crates/velin-lang",
    "crates/velin",
    "crates/velin-cli",
    "crates/velin-lsp",
    "crates/velin-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
repository = "https://github.com/wsafight/velin"
homepage = "https://github.com/wsafight/velin"
documentation = "https://docs.rs/velin"

[profile.release]
# ThinLTO enables cross-crate optimization while retaining parallel codegen.
# This keeps release builds practical for workspace development and embedding.
lto = "thin"
strip = "symbols"

[workspace.dependencies]
velin-syntax = { version = "0.1.1", path = "crates/velin-syntax" }
velin-parse = { version = "0.1.1", path = "crates/velin-parse" }
velin-eval = { version = "0.1.1", path = "crates/velin-eval" }
velin-compile = { version = "0.1.1", path = "crates/velin-compile" }
velin-vm = { version = "0.1.1", path = "crates/velin-vm" }
velin-check = { version = "0.1.1", path = "crates/velin-check" }
velin-lang = { version = "0.1.1", path = "crates/velin-lang" }
velin = { version = "0.1.1", path = "crates/velin" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
