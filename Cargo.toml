[workspace]
members = [
    "crates/velin-syntax",
    "crates/velin-parse",
    "crates/velin-eval",
    "crates/velin-bytecode",
    "crates/velin-compile",
    "crates/velin-vm",
    "crates/velin-check",
    "crates/velin-lang",
    "crates/velin",
    "crates/velin-cli",
    "crates/velin-lsp",
    "crates/velin-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
repository = "https://github.com/wsafight/velin"
homepage = "https://github.com/wsafight/velin"
documentation = "https://docs.rs/velin"

[profile.release]
# ThinLTO enables cross-crate optimization while retaining parallel codegen.
# This keeps release builds practical for workspace development and embedding.
lto = "thin"
strip = "symbols"

[workspace.dependencies]
velin-syntax = { version = "0.1.2", path = "crates/velin-syntax", default-features = false }
velin-parse = { version = "0.1.2", path = "crates/velin-parse", default-features = false }
velin-eval = { version = "0.1.2", path = "crates/velin-eval", default-features = false }
velin-bytecode = { version = "0.1.2", path = "crates/velin-bytecode", default-features = false }
velin-compile = { version = "0.1.2", path = "crates/velin-compile", default-features = false }
velin-vm = { version = "0.1.2", path = "crates/velin-vm", default-features = false }
velin-check = { version = "0.1.2", path = "crates/velin-check", default-features = false }
velin-lang = { version = "0.1.2", path = "crates/velin-lang", default-features = false }
velin = { version = "0.1.2", path = "crates/velin", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
