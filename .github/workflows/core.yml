name: Core

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - 'README.md'
      - 'README.zh-CN.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - 'README.md'
      - 'README.zh-CN.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-source-lines.sh
      - run: bash scripts/check-release-version.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
      - run: cargo bench --workspace --all-features --no-run
      - run: cargo bench -p velin-wasm --features runtime --bench runtime --no-run
      - run: bash scripts/check-performance.sh
      - run: cargo build -p velin-wasm --target wasm32-unknown-unknown
      - run: bash scripts/test-c-api.sh
      - run: cargo package --workspace

  windows-artifact-replace:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p velin-cli --test cli binary_compile_writes_an_artifact_that_check_and_run_accept
