name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            vsce_target: linux-x64
            executable_suffix: ''
          - label: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            vsce_target: darwin-x64
            executable_suffix: ''
          - label: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            vsce_target: darwin-arm64
            executable_suffix: ''
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            vsce_target: win32-x64
            executable_suffix: '.exe'
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      VSCE_TARGET: ${{ matrix.vsce_target }}
      EXE: ${{ matrix.executable_suffix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode-velin/package-lock.json
      - name: Build CLI and language server
        run: cargo build --locked --release --target ${{ matrix.target }} -p velin-cli -p velin-lsp
      - name: Prepare binaries and extension
        shell: bash
        run: |
          version="$(node -p "require('./editors/vscode-velin/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match manifest version v${version}" >&2
            exit 1
          fi
          archive_name="velin-v${version}-${TARGET}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=${archive_name}" >> "$GITHUB_ENV"
          mkdir -p "dist/${archive_name}" editors/vscode-velin/bin
          cp "target/${TARGET}/release/velin${EXE}" "dist/${archive_name}/"
          cp "target/${TARGET}/release/velin-lsp${EXE}" "dist/${archive_name}/"
          cp README.md README.zh-CN.md LICENSE "dist/${archive_name}/"
          cp "target/${TARGET}/release/velin-lsp${EXE}" editors/vscode-velin/bin/
      - run: npm ci
        working-directory: editors/vscode-velin
      - name: Package platform VSIX
        shell: bash
        working-directory: editors/vscode-velin
        run: npx vsce package --target "$VSCE_TARGET" --out "../../dist/velin-vscode-v${VERSION}-${VSCE_TARGET}.vsix"
      - name: Archive Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C dist -czf "dist/${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
      - name: Archive Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:ARCHIVE_NAME/*" -DestinationPath "dist/$env:ARCHIVE_NAME.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.vsix
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Write checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
