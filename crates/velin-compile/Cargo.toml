[package]
name = "velin-compile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Bytecode compiler: lowers Velin expressions and programs to a flat, slot-addressed IR"

[features]
default = ["serde"]
serde = ["velin-syntax/serde", "velin-bytecode/serde"]

[dependencies]
velin-syntax = { workspace = true, default-features = false }
velin-eval = { workspace = true, default-features = false }
velin-bytecode = { workspace = true, default-features = false }

[dev-dependencies]
velin-parse.workspace = true
serde_json.workspace = true

[lints]
workspace = true
