[package]
name = "velin-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "WebAssembly bindings for Velin: compile, check, and run a .velin script in the browser"

[features]
default = ["source"]
source = ["dep:velin"]
runtime = ["dep:velin-bytecode", "dep:velin-syntax", "dep:velin-vm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
velin = { workspace = true, optional = true }
velin-bytecode = { workspace = true, features = ["serde"], optional = true }
velin-syntax = { workspace = true, features = ["serde"], optional = true }
velin-vm = { workspace = true, default-features = false, optional = true }
wasm-bindgen = "0.2"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
velin = { workspace = true }

[[bench]]
name = "runtime"
harness = false

# NOTE: unlike the core crates, this shim does not set `unsafe_code = "forbid"`:
# `#[wasm_bindgen]` expands to generated `unsafe` glue, which `forbid` cannot
# permit. All *authored* code here is safe; the crate only marshals strings and
# delegates every language decision to `velin` (which keeps the forbid gate).
[lints.clippy]
all = "warn"
pedantic = "warn"
